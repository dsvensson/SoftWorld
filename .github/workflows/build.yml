# Release builds of softworld, the client with its own server, for Windows
# (64-bit and 32-bit), macOS and Linux, uploaded as artifacts; and for a
# version tag (v3.06) to the tag's GitHub release (release.sh). Every target is
# built, the tests too, and the tests run where the runner's CPU runs the build
# (cpu_supported): the maps test on the shareware's (shareware.sh).

name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# the Quake archive's commit the shareware comes from
env:
  QUAKE_ARCHIVE: 30c29bd5907fd999b0bb8e52c941ef770b4d3ba8

jobs:
  # the shareware's maps, fetched once and only when they aren't cached, for the
  # other jobs to take from the cache (on Windows too: enableCrossOsArchive)
  shareware:
    name: Shareware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cached shareware
        id: shareware
        uses: actions/cache@v6
        with:
          path: shareware
          key: shareware-pak0-${{ env.QUAKE_ARCHIVE }}
          enableCrossOsArchive: true

      - name: Shareware's maps
        if: steps.shareware.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          bash .github/shareware.sh

  build:
    name: ${{ matrix.name }}
    needs: shareware
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Windows for AVX-512 CPUs, for AVX2 ones without it, and 32-bit
        # Windows (x86, the scalar kernels)
        include:
          - name: Windows x86-64-v4
            os: windows-2025-vs2026
            arch: x86-64-v4
            preset: msvc-v4
            fteqcc: fteqcc.exe
          - name: Windows x86-64-v3
            os: windows-2025-vs2026
            arch: x86-64-v3
            preset: msvc-v3
            fteqcc: fteqcc.exe
          - name: Windows x86
            os: windows-2025-vs2026
            arch: x86
            preset: msvc-x86
            fteqcc: fteqcc.exe
            vsarch: x86
          - name: macOS
            os: macos-26
            preset: macos-m3
            fteqcc: fteqcc

    # fteqcc compiles qw-qc into the game the server carries (cmake/qwprogs.cmake)
    env:
      FTEQCC: ${{ github.workspace }}/fteqcc/${{ matrix.fteqcc }}
      PRESET: ${{ matrix.preset }}
      # the programs' architecture: Windows' developer shell's compiler for it
      VSARCH: ${{ matrix.vsarch || 'x64' }}

    steps:
      - uses: actions/checkout@v7

      - name: Shareware
        uses: actions/cache/restore@v6
        with:
          path: shareware
          key: shareware-pak0-${{ env.QUAKE_ARCHIVE }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # fteqcc from fteqw's newest commit, built again only when there is a newer
      - name: fteqw's commit
        id: fteqw
        shell: bash
        run: echo "sha=$(git ls-remote https://github.com/fte-team/fteqw.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cached fteqcc
        id: fteqcc
        uses: actions/cache@v6
        with:
          path: fteqcc
          key: fteqcc-qclib-${{ runner.os }}-${{ steps.fteqw.outputs.sha }}

      # built by the qc compiler's own Makefile (engine/qclib), ten C files and
      # nothing configured: C17 as fteqw is written in, optimized, without zlib,
      # which qw-qc doesn't need, and named by its revision as fteqw's builds are
      - name: fteqw's source
        id: fteqw-src
        if: steps.fteqcc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init -q fteqw
          git -C fteqw fetch -q --depth 1 https://github.com/fte-team/fteqw.git ${{ steps.fteqw.outputs.sha }}
          git -C fteqw checkout -q FETCH_HEAD
          revision="git-$(git -C fteqw rev-parse --short=7 HEAD)"
          date="$(git -C fteqw log -1 --format=%cs)"
          echo "cflags=-O2 -std=gnu17 -DNO_ZLIB -DSVNREVISION=$revision -DSVNDATE=$date" >> "$GITHUB_OUTPUT"

      - name: MSYS2's gcc and make
        if: steps.fteqcc.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc

      # linked statically, to run outside MSYS2
      - name: Build fteqcc (Windows)
        if: steps.fteqcc.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -C fteqw/engine/qclib qcc CC=gcc CFLAGS="${{ steps.fteqw-src.outputs.cflags }}" BASE_LDFLAGS=-static
          mkdir -p fteqcc
          cp fteqw/engine/qclib/fteqcc.bin fteqcc/fteqcc.exe

      - name: Build fteqcc (macOS)
        if: steps.fteqcc.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          make -C fteqw/engine/qclib qcc CC=cc CFLAGS="${{ steps.fteqw-src.outputs.cflags }}" BASE_LDFLAGS=
          mkdir -p fteqcc
          cp fteqw/engine/qclib/fteqcc.bin fteqcc/fteqcc

      # MSVC, the Windows SDK's fxc and Ninja, from a Visual Studio developer shell
      # for the programs' architecture (VSARCH)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=$env:VSARCH -host_arch=x64"
          cmake --preset ${{ matrix.preset }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # the Metal shader compiler is a component of Xcode's, downloaded apart
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q 'Status: installed' \
            || sudo xcodebuild -downloadComponent MetalToolchain
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # the runners' CPUs all run AVX2, not all AVX-512, and the M3's builds
      # don't run on an M1: the tests run where the CPU runs the build (what
      # cpu_supported says goes to the log)
      - name: CPU
        id: cpu
        shell: bash
        run: |
          if build/$PRESET/Release/cpu_supported; then runs=true; else runs=false; fi
          echo "runs=$runs" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.cpu.outputs.runs == 'true'
        shell: bash
        env:
          SW_BASEDIR: ${{ github.workspace }}/shareware
        run: |
          ctest --preset $PRESET
          ctest --preset $PRESET-maps

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, release | Out-Null
          Copy-Item build/${{ matrix.preset }}/Release/softworld.exe dist/
          Compress-Archive -Path dist/softworld.exe -DestinationPath release/SoftWorld-Windows-${{ matrix.arch }}.zip

      # zipped here: the artifact's own zip loses the executable bit. Without the
      # extended attributes, which unzip would make files in the bundle of and so
      # break its signature (and the sandbox's entitlements with it)
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --norsrc --noextattr --noqtn --keepParent \
            build/${{ matrix.preset }}/Release/softworld.app dist/SoftWorld-macOS.zip

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SoftWorld-Windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      # the zip as it is, not zipped again
      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: SoftWorld-macOS.zip
          path: dist/SoftWorld-macOS.zip
          archive: false
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ runner.os == 'Windows' && format('release/SoftWorld-Windows-{0}.zip', matrix.arch) || 'dist/SoftWorld-macOS.zip' }}
        run: bash .github/release.sh "$ASSET"

  # Linux in an Arch container: Ubuntu's wayland-protocols is older than the
  # color management the client asks the compositor about. For AVX-512 CPUs,
  # and for AVX2 ones without it.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: shareware
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64-v4
            preset: linux-v4
          - arch: x86-64-v3
            preset: linux-v3

    env:
      FTEQCC: ${{ github.workspace }}/fteqcc/fteqcc
      PRESET: ${{ matrix.preset }}

    steps:
      - name: Packages
        run: |
          pacman -Syu --noconfirm --needed git make gcc cmake ninja clang lld llvm pkgconf vulkan-headers \
            vulkan-icd-loader glslang wayland wayland-protocols libxkbcommon libpipewire github-cli

      - uses: actions/checkout@v7

      - name: Shareware
        uses: actions/cache/restore@v6
        with:
          path: shareware
          key: shareware-pak0-${{ env.QUAKE_ARCHIVE }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: fteqw's commit
        id: fteqw
        run: echo "sha=$(git ls-remote https://github.com/fte-team/fteqw.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cached fteqcc
        id: fteqcc
        uses: actions/cache@v6
        with:
          path: fteqcc
          key: fteqcc-qclib-Linux-${{ steps.fteqw.outputs.sha }}

      # as for Windows and macOS: qclib's own Makefile, without zlib
      - name: Build fteqcc
        if: steps.fteqcc.outputs.cache-hit != 'true'
        run: |
          git init -q fteqw
          git -C fteqw fetch -q --depth 1 https://github.com/fte-team/fteqw.git ${{ steps.fteqw.outputs.sha }}
          git -C fteqw checkout -q FETCH_HEAD
          revision="git-$(git -C fteqw rev-parse --short=7 HEAD)"
          date="$(git -C fteqw log -1 --format=%cs)"
          make -C fteqw/engine/qclib qcc CC=cc \
            CFLAGS="-O2 -std=gnu17 -DNO_ZLIB -DSVNREVISION=$revision -DSVNDATE=$date" BASE_LDFLAGS=
          mkdir -p fteqcc
          cp fteqw/engine/qclib/fteqcc.bin fteqcc/fteqcc

      - name: Build
        run: |
          cmake --preset $PRESET
          cmake --build --preset $PRESET

      # as for Windows: the runners' CPUs all run AVX2, not all AVX-512
      - name: CPU
        id: cpu
        run: |
          if build/$PRESET/Release/cpu_supported; then runs=true; else runs=false; fi
          echo "runs=$runs" >> "$GITHUB_OUTPUT"

      # without a GPU, present_vulkan is skipped. The shareware by the working
      # directory: github.workspace is the host's path, not the container's
      - name: Test
        if: steps.cpu.outputs.runs == 'true'
        run: |
          ctest --preset $PRESET
          SW_BASEDIR="$PWD/shareware" ctest --preset $PRESET-maps

      # tarred here: the artifact's own zip loses the executable bit
      - name: Package
        run: |
          mkdir -p dist
          tar -C build/$PRESET/Release -czf dist/SoftWorld-Linux-${{ matrix.arch }}.tar.gz softworld

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: SoftWorld-Linux-${{ matrix.arch }}.tar.gz
          path: dist/SoftWorld-Linux-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release.sh dist/SoftWorld-Linux-${{ matrix.arch }}.tar.gz
